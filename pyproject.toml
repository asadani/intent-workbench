[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-workbench"
version = "0.1.0"
description = "Explore intended behavior before implementation."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
intent-workbench = "intent_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["intent_workbench*"]
